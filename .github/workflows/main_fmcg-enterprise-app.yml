name: Build and deploy ASP.NET Core app to Azure Web App - fmcg-enterprise-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet
        run: dotnet build FMCGEnterpriseManagementSystem/FMCGEnterpriseManagementSystem/FMCGEnterpriseManagementSystem.csproj --configuration Release -p:TreatWarningsAsErrors=false

      - name: dotnet publish
        run: dotnet publish FMCGEnterpriseManagementSystem/FMCGEnterpriseManagementSystem/FMCGEnterpriseManagementSystem.csproj -c Release -o ./publish -p:TreatWarningsAsErrors=false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fmcg-enterprise-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_48A7BCA6D7EA48288BDC82FCA6CE02EB }}
          package: .
